[printer]
kinematics: corexy
max_velocity: 520
max_accel: 11000
max_accel_to_decel: 11000
square_corner_velocity: 3.5
max_z_velocity: 12
max_z_accel: 220

# ==========================
# Drivers moteurs
# ==========================

[tmc2209 stepper_x]
run_current: 0.82
hold_current: 0.50
stealthchop_threshold: 140
interpolate: True

[tmc2209 stepper_y]
run_current: 0.82
hold_current: 0.50
stealthchop_threshold: 140
interpolate: True

[tmc2209 stepper_z]
run_current: 0.70
hold_current: 0.40
stealthchop_threshold: 999999
interpolate: True

[tmc2209 extruder]
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 0
interpolate: False

[filament_hub]
cruising_speed: 250
default_feed_speed: 45
default_unwind_speed: 35

[extruder]
pressure_advance: 0.035
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 120

# ==========================
# Ventilateur
# ==========================

[fan]
kick_start_time: 0.4
off_below: 0.15

# ==========================
# Bed Mesh
# ==========================

[bed_mesh]
speed: 220
horizontal_move_z: 5
mesh_min: 15,15
mesh_max: 215,205
probe_count: 5,5
algorithm: bicubic
fade_start: 1
fade_end: 8

# ==========================
# Input Shaper
# ==========================

[input_shaper]
shaper_type_x: 3hump_ei
shaper_freq_x: 74
shaper_type_y: 2hump_ei
shaper_freq_y: 56.6